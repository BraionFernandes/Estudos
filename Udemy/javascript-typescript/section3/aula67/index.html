<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 67 - Lista de Tarefas</title>
    <style>

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        body{
            background-color: darkred;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }

        .container{
            background-color: #fff;
            width: 800px;
            height: 500px;
            padding: 25px;
            border-radius: 25px;
        }

        .titulo{
            font-size: 2.5em;
            text-align: center;
            padding: 10px;
            margin-bottom: 40px;
        }

        .addTarefa{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .caixaTexto{
            font-family: Arial, Helvetica, sans-serif;
            width: 350px;
            padding: 10px;
            border: none;
            background-color: rgba(128, 128, 128, 0.623);
            border-radius: 5px;
            outline: none;
            font-weight: 600;
        }

        .btnAdicionar{
            width: 150px;
            padding: 10px;
            border: none;
            background-color: darkred;
            border-radius: 5px;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
        }

        .elementos{
            display: flex;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            margin-top: 50px;
            overflow: scroll;
            overflow-x: auto;
            height: 250px;
            min-width: 0;
            min-height: 0;
        }

        .elemento{
            background-color: rgb(170, 170, 170);
            width: 500px;
            padding: 10px;
            margin: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 5px;
        }

        .elemento-text{
            font-weight: 600;
            font-size: 1.1em;
            text-indent: 5px;
        }

        .elemento-btn{
            padding: 8px;
            background-color: darkred;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: 500;
            font-size: 1.1em;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1 class="titulo">Lista de Tarefas</h1>
        <div class="addTarefa">
            <input class="caixaTexto" type="text">
            <button class="btnAdicionar">Adicionar tarefa</button>
        </div>
        <div class="elementos">
            <div class="elemento">
                <span class="elemento-text">Teste</span>
                <button class="elemento-btn">Apagar</button>
            </div>
            <div class="elemento">
                <span class="elemento-text">Teste</span>
                <button class="elemento-btn">Apagar</button>
            </div>
            <div class="elemento">
                <span class="elemento-text">Teste</span>
                <button class="elemento-btn">Apagar</button>
            </div>
            <div class="elemento">
                <span class="elemento-text">Teste</span>
                <button class="elemento-btn">Apagar</button>
            </div>
            <div class="elemento">
                <span class="elemento-text">Teste</span>
                <button class="elemento-btn">Apagar</button>
            </div>
            <div class="elemento">
                <span class="elemento-text">Teste</span>
                <button class="elemento-btn">Apagar</button>
            </div>
        </div>
    </div>
</body>

<script src="script.js"></script>
</html>
