<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empire Corporation - Autenticação</title>
    
    <!-- Tailwind CSS via CDN para rodar direto no HTML -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Configuração de fontes customizadas -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Cinzel', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-black flex items-center justify-center p-4">
    
    <!-- Container Principal -->
    <div class="max-w-md w-full bg-zinc-950 border border-amber-500/20 p-8 rounded-xl shadow-[0_0_30px_rgba(217,119,6,0.1)] relative overflow-hidden">
        
        <!-- Detalhe de luz sutil no topo do card -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-[1px] bg-gradient-to-r from-transparent via-amber-500 to-transparent opacity-50"></div>

        <!-- Cabeçalho / Logo -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-serif font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-600 via-yellow-500 to-amber-400 uppercase tracking-[0.2em]">
                Empire
            </h1>
            <p class="text-zinc-500 text-xs mt-2 tracking-[0.3em] uppercase">Corporation</p>
        </div>

        <!-- Formulário -->
        <form class="space-y-6" action="#" method="POST">
            
            <!-- Campo Nome (Deixei comentado caso queira usar para a tela de Cadastro) -->
            <!-- 
            <div>
                <label class="block text-zinc-400 text-xs uppercase tracking-wider mb-2">
                    Nome Completo
                </label>
                <input 
                    type="text" 
                    class="w-full bg-zinc-900/50 border border-zinc-800 focus:border-amber-500 text-zinc-100 rounded-md px-4 py-3 outline-none transition-all duration-300 placeholder:text-zinc-700" 
                    placeholder="Seu nome oficial" 
                    required
                />
            </div>
            -->
            
            <!-- Campo E-mail -->
            <div>
                <label class="block text-zinc-400 text-xs uppercase tracking-wider mb-2">
                    Credencial de Acesso
                </label>
                <input 
                    type="email" 
                    class="w-full bg-zinc-900/50 border border-zinc-800 focus:border-amber-500 text-zinc-100 rounded-md px-4 py-3 outline-none transition-all duration-300 placeholder:text-zinc-700" 
                    placeholder="id@empirecorp.com" 
                    required
                />
            </div>
            
            <!-- Campo Senha -->
            <div>
                <label class="block text-zinc-400 text-xs uppercase tracking-wider mb-2">
                    Código de Segurança
                </label>
                <input 
                    type="password" 
                    class="w-full bg-zinc-900/50 border border-zinc-800 focus:border-amber-500 text-zinc-100 rounded-md px-4 py-3 outline-none transition-all duration-300 placeholder:text-zinc-700" 
                    placeholder="••••••••" 
                    required
                />
            </div>

            <!-- Botão -->
            <div class="pt-2">
                <button 
                    type="submit"
                    class="w-full bg-gradient-to-r from-amber-700 via-amber-600 to-amber-700 hover:from-amber-600 hover:via-yellow-500 hover:to-amber-600 text-black font-bold uppercase tracking-widest py-3.5 rounded-md transition-all duration-300 shadow-[0_0_15px_rgba(217,119,6,0.2)] hover:shadow-[0_0_25px_rgba(217,119,6,0.4)]"
                >
                    Autenticar
                </button>
            </div>
        </form>

        <!-- Alternância Login/Cadastro -->
        <div class="mt-8 text-center border-t border-zinc-800/50 pt-6">
            <a href="#" class="inline-block text-zinc-500 hover:text-amber-500 text-xs tracking-wider uppercase transition-colors duration-300">
                Sem acesso? Solicitar credenciais
            </a>
        </div>
    </div>
    
</body>
</html>
